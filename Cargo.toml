[package]
name = "fastdsu"
version = "0.1.0"
edition = "2024"

[lib]
name = "_core"
# "cdylib" is necessary to produce a shared library for Python to import from.
crate-type = ["cdylib"]

[dependencies]
# "abi3-py311" builds against the stable ABI for Python 3.11+
# We intentionally avoid pyo3's `extension-module` feature so `cargo test`
# can link test binaries against libpython.
pyo3 = { version = "0.27.1", features = ["abi3-py311"] }
pyo3-arrow = "0.15.0"
arrow-array = "57"
arrow-schema = "57"
