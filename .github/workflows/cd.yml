name: CD

on:
  release:
    types: [published]

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-13, macos-14]

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@1780873c7b576612439a134613cc4cc74ce5538c # v1.15.2

    - name: Install uv and Python
      uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b # v7.3.0
      with:
        python-version: "3.11"

    - name: Install cibuildwheel
      run: uv tool install cibuildwheel

    - name: Build wheels
      run: uv tool run cibuildwheel --output-dir wheelhouse
      env:
        CIBW_BUILD: cp311-* cp312-* cp313-* cp314-*
        CIBW_SKIP: pp* *-win32 *i686* *-musllinux*
        CIBW_BUILD_VERBOSITY: 1
        CIBW_BEFORE_BUILD: "uv tool install maturin"
        CIBW_BUILD_FRONTEND: "build"
        MACOSX_DEPLOYMENT_TARGET: "11.0"

    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: wheel-builds-${{ matrix.os }}
        path: ./wheelhouse/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@1780873c7b576612439a134613cc4cc74ce5538c # v1.15.2

    - name: Install uv and Python
      uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b # v7.3.0
      with:
        python-version: "3.11"

    - name: Build source distribution
      run: uv build --sdist --out-dir dist

    - name: Upload sdist
      uses: actions/upload-artifact@v4
      with:
        name: sdist
        path: dist/*.tar.gz

  deploy-package:
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    environment: pypi

    steps:
    - name: Download wheel artifacts
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        pattern: wheel-builds-*
        path: dist
        merge-multiple: true

    - name: Download sdist artifact
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        name: sdist
        path: dist

    - name: Publish package to PyPI
      uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
